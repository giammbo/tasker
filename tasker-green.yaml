# Deployment GREEN di Tasker (versione nuova, in test prima dello switch).
# Per la demo blue/green a mano della EP8.
# Identico al blue tranne la label `version: green` e il tag immagine nuovo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasker-green
  labels:
    app: tasker
    version: green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tasker
      version: green
  template:
    metadata:
      labels:
        app: tasker
        version: green
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: tasker
              version: green
      serviceAccountName: tasker-sa
      containers:
      - name: tasker
        # Tag immagine della versione NUOVA (sostituisci con il nuovo SHA).
        image: 405894862385.dkr.ecr.eu-west-1.amazonaws.com/tasker:0.3.5
        ports:
        - containerPort: 5000
        env:
          - name: APP_VERSION
            value: 0.3.5-green
          - name: POSTGRES_HOST
            valueFrom:
              configMapKeyRef:
                name: postgres-config
                key: POSTGRES_HOST
          - name: POSTGRES_PORT
            valueFrom:
              configMapKeyRef:
                name: postgres-config
                key: POSTGRES_PORT
          - name: POSTGRES_DB
            valueFrom:
              configMapKeyRef:
                name: postgres-config
                key: POSTGRES_DB
          - name: POSTGRES_USER
            valueFrom:
              configMapKeyRef:
                name: postgres-config
                key: POSTGRES_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: tasker-db-credentials
                key: password
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
