# GitHub Actions workflow per Tasker.
# Da git push su main, builda l'immagine arm64 (Graviton), la pusha su ECR
# con tag = SHA del commit, e aggiorna il Rollout (Argo Rollouts) su EKS.
#
# Autenticazione AWS: OIDC federation. NESSUNA chiave AWS statica nei Secrets
# di GitHub. Il workflow assume il ruolo BreakingProdGitHubActionsRole, che
# si fida solo dei push sul branch main di questo repository.
#
# NOTA (EP8): il workload e' un Rollout di Argo Rollouts, non un Deployment.
# Il deploy usa `kubectl argo rollouts set image`, che fa partire la strategia
# canary definita in tasker-rollout-argo.yaml. Il plugin argo rollouts va
# installato nel runner (step dedicato sotto).
#
# MODELLO DI DEPLOY: la pipeline fa partire il canary e verifica che il primo
# step diventi sano (pod canary healthy + smoke test). NON porta il rollout al
# 100%: la promozione finale e' un gesto MANUALE, fatto da chi rilascia dopo
# aver guardato l'app, con `kubectl argo rollouts promote tasker`. E' il punto
# della EP8: la pipeline porta il canary fino al punto di controllo, l'umano
# decide se completare.

name: Deploy Tasker to EKS

on:
  # Parte automaticamente su push a main, ma solo se cambiano file rilevanti.
  # Cosi un README aggiornato non scatena un build inutile.
  push:
    branches:
      - main
    paths:
      - 'app.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'tasker-rollout-argo.yaml'
      - '.github/workflows/deploy.yaml'
  # Bottone "Run workflow" manuale dalla UI di GitHub Actions.
  # Comodo per re-deploy senza commit, o per il primo run di test.
  workflow_dispatch: {}

# Permessi del workflow.
# id-token: write e' OBBLIGATORIO per OIDC - senza, GitHub non rilascia il
# JWT che ci serve per autenticarsi su AWS.
# contents: read serve per actions/checkout.
permissions:
  id-token: write
  contents: read

# Evita che due push ravvicinati partano in parallelo e si pestino i piedi.
# Se arriva un nuovo run mentre uno e' in corso, il precedente NON viene
# annullato (annullare un deploy a meta' sarebbe peggio): il nuovo aspetta.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  EKS_CLUSTER_NAME: tasker-eks
  ECR_REPOSITORY: tasker
  # Sostituisci con l'ARN del tuo IAM role per OIDC.
  AWS_ROLE_ARN: arn:aws:iam::405894862385:role/BreakingProdGitHubActionsRole

jobs:
  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    # Tip: per build arm64 nativo (senza emulazione QEMU) usa:
    # runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      # 1. Checkout del codice.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. OIDC: ottieni credenziali AWS temporanee assumendo il role.
      #    Nessuna access key qui dentro: il token JWT lo fornisce GitHub,
      #    AWS STS lo verifica contro la trust policy del role.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # Tag visibile in CloudTrail: utile per audit ("chi ha deployato cosa")
          role-session-name: github-actions-${{ github.run_id }}

      # 3. Login su Amazon ECR (usa le credenziali appena ottenute via OIDC).
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Setup buildx per il build multi-arch.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Build dell'immagine arm64 (per i nodi Graviton del cluster) e push
      #    su ECR. Il tag e' il SHA del commit: ogni deploy ha un'immagine
      #    immutabile e tracciabile fino al commit esatto.
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          # Cache dei layer su GitHub: i build successivi sono molto piu' veloci.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. Configura kubectl per il cluster EKS.
      #    Richiede che il role abbia eks:DescribeCluster e che esista una
      #    EKS Access Entry per il role (lato Kubernetes RBAC).
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}
          kubectl version --client
          kubectl get nodes

      # 7. Installa il plugin kubectl argo rollouts nel runner.
      #    Serve per i comandi `kubectl argo rollouts` degli step successivi.
      - name: Install kubectl argo rollouts plugin
        run: |
          set -euo pipefail
          curl -sSL -o kubectl-argo-rollouts \
            https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64
          chmod +x kubectl-argo-rollouts
          sudo mv kubectl-argo-rollouts /usr/local/bin/kubectl-argo-rollouts
          kubectl argo rollouts version

      # 8. Aggiorna l'immagine del Rollout: fa partire la strategia canary.
      #    `set image` cambia solo il tag; Argo Rollouts esegue gli step canary
      #    (setWeight + pause) definiti in tasker-rollout-argo.yaml.
      #    NON usiamo `rollouts status` qui: il manifest ha una pausa indefinita
      #    (pause: {}) tra il 50% e il 100%, quindi il rollout NON si completa
      #    da solo - aspetta una promozione manuale. Bloccare lo step in attesa
      #    del completamento andrebbe in timeout.
      #    Diamo solo il via al canary e proseguiamo allo smoke test.
      - name: Start canary deploy
        run: |
          set -euo pipefail
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "Avvio canary con immagine: ${IMAGE}"
          kubectl argo rollouts set image tasker tasker="${IMAGE}"
          # Aspetta che il canary raggiunga uno stato stabile parziale (pausa),
          # cioe' che i pod canary siano healthy. Se i pod canary non diventano
          # sani, questo va in errore e il workflow fallisce: e' il
          # comportamento voluto (release rotta = pipeline rossa).
          kubectl argo rollouts status tasker --timeout 300s || {
            STATUS=$(kubectl argo rollouts status tasker --timeout 1s 2>&1 || true)
            echo "Stato rollout: ${STATUS}"
            # "Paused" e' uno stato ATTESO (pausa canary), non un errore.
            echo "${STATUS}" | grep -qi "Paused" && echo "Canary in pausa, ok" && exit 0
            echo "Canary non sano" >&2
            exit 1
          }

      # 9. Smoke test sul canary: l'app risponde durante il canary?
      #    Le readinessProbe (EP6) tengono comunque fuori dal Service i pod
      #    canary non sani: questa e' una verifica in piu'.
      - name: Smoke test
        run: |
          set -euo pipefail
          ELB=$(kubectl get svc tasker-service \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          if [ -z "${ELB}" ]; then
            echo "ELB hostname non disponibile" >&2
            exit 1
          fi
          echo "Testing http://${ELB}/health"
          for i in 1 2 3 4 5; do
            response=$(curl -fsS "http://${ELB}/health" || true)
            echo "Attempt ${i}: ${response}"
            if echo "${response}" | grep -q '"status":"ok"'; then
              echo "Smoke test OK"
              exit 0
            fi
            sleep 5
          done
          echo "Smoke test failed dopo 5 tentativi" >&2
          exit 1

      # 10. Riepilogo nella UI di GitHub Actions.
      #     Il canary e' partito ed e' sano fino al punto di pausa. La
      #     PROMOZIONE FINALE al 100% e' manuale:
      #       kubectl argo rollouts promote tasker
      #     (oppure abort: kubectl argo rollouts abort tasker)
      - name: Summary
        if: always()
        run: |
          {
            echo "## Deploy summary (canary)"
            echo ""
            echo "- **Commit**: \`${{ github.sha }}\`"
            echo "- **Image**: \`${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}\`"
            echo "- **Cluster**: \`${{ env.EKS_CLUSTER_NAME }}\` (${{ env.AWS_REGION }})"
            echo "- **Triggered by**: \`${{ github.event_name }}\` from \`${{ github.actor }}\`"
            echo ""
            echo "Il canary e' partito ed e' sano fino al punto di pausa."
            echo "Promozione finale manuale: \`kubectl argo rollouts promote tasker\`"
            echo "Rollback: \`kubectl argo rollouts abort tasker\`"
          } >> "$GITHUB_STEP_SUMMARY"
