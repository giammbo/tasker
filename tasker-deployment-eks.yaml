# IMPORTANTE: sostituisci <ACCOUNT_ID> con il tuo AWS account ID prima di applicare.
#
# Versione EP6 (alta disponibilita').
# Il database e' il cluster CloudNativePG: la password sta nel Secret K8s
# "tasker-db-credentials". Tasker la legge come variabile d'ambiente via
# secretKeyRef - niente piu' volume CSI Secrets Store ne' lettura da file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasker
  labels:
    app: tasker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tasker
  template:
    metadata:
      labels:
        app: tasker
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: tasker
      serviceAccountName: tasker-sa
      containers:
      - name: tasker
        image: 405894862385.dkr.ecr.eu-west-1.amazonaws.com/tasker:0.3.1
        ports:
        - containerPort: 5000
        env:
          - name: POSTGRES_HOST
            valueFrom:
              configMapKeyRef:
                name: postgres-config
                key: POSTGRES_HOST
          - name: POSTGRES_PORT
            valueFrom:
              configMapKeyRef:
                name: postgres-config
                key: POSTGRES_PORT
          - name: POSTGRES_DB
            valueFrom:
              configMapKeyRef:
                name: postgres-config
                key: POSTGRES_DB
          - name: POSTGRES_USER
            valueFrom:
              configMapKeyRef:
                name: postgres-config
                key: POSTGRES_USER
          # Password dell'utente del database, dal Secret del cluster CNPG.
          # name = nome del Secret, key = chiave dentro al Secret.
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: tasker-db-credentials
                key: password
        # resources: OBBLIGATORIO per la EP6.
        # - requests: la quota garantita. Lo scheduler la usa per piazzare il
        #   pod, e l'HPA calcola la percentuale di CPU RISPETTO a requests.cpu.
        #   Senza requests.cpu l'HPA non sa su cosa calcolare il 70% e NON scala.
        # - limits: il tetto massimo. Se il container supera limits.memory viene
        #   terminato (OOMKilled); se supera limits.cpu viene rallentato (throttled).
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        startupProbe:
          httpGet:
            path: /health
            port: 5000
          failureThreshold: 30
          periodSeconds: 2

        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          periodSeconds: 5
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
