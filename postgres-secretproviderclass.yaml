# SecretProviderClass per Postgres.
# Dice al Secrets Store CSI Driver:
# - parla con AWS Secrets Manager nella region eu-west-1
# - usa Pod Identity (non IRSA) per autenticarsi via il service account
# - prendi il secret "breaking-prod/postgres-password"
# - estraine la chiave "password" e mappala nel file "POSTGRES_PASSWORD"
#
# NOTA (modo canonico): NON c'e' la sezione secretObjects. Non sincronizziamo
# piu' un Secret K8s. La password viene montata SOLO come file nel pod, in
# /mnt/secrets-store/POSTGRES_PASSWORD. Cosi:
#  - niente dipendenza circolare (il pod non aspetta un Secret per partire)
#  - la password non passa mai per etcd (piu' sicuro)
# I pod leggono il file: Postgres via POSTGRES_PASSWORD_FILE, Tasker via
# la funzione _file_env() in app.py.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: postgres-secret-provider
spec:
  provider: aws
  parameters:
    region: eu-west-1
    objects: |
      - objectName: "breaking-prod/postgres-password"
        objectType: "secretsmanager"
        jmesPath:
          - path: "password"
            objectAlias: "POSTGRES_PASSWORD"
    usePodIdentity: "true"
